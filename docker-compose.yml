services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - PORT=3000
      # - PUBLIC_URL=https://children.thehopebeyondmeasure.org
      # - SMTP_HOST=...
      # - SMTP_PORT=587
      # - SMTP_USER=...
      # - SMTP_PASS=...
      # - MAIL_FROM=dashboard@thehopebeyondmeasure.org

  # Quick tunnel (random *.trycloudflare.com URL, fine for testing).
  # For a stable URL, create a named tunnel and use:
  #   command: tunnel --no-autoupdate run
  #   environment: [TUNNEL_TOKEN=<token from Cloudflare Zero Trust dashboard>]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
